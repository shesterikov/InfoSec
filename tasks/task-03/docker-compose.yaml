services:
  db:
    image: postgres
    command: postgres -c 'max_connections=200'
    container_name: db
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: student
      POSTGRES_PASSWORD: emVyMC1kYXkuYXZp

  pg:
    image: dpage/pgadmin4:8.9
    container_name: pg
    restart: unless-stopped
    depends_on:
      - db
    environment:
      - PGADMIN_DEFAULT_EMAIL=student@npi-tu.ru
      - PGADMIN_DEFAULT_PASSWORD=aGVsbG9mcmllbmQubW92
    ports:
      - '7777:80'