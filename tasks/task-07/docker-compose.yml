services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://student:HjjnGytfnhg@db/db?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    networks:
      lab:
        aliases: [target]
    ports:
      - '127.0.0.1:8080:8080'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/health']
      interval: 5s
      timeout: 3s
      retries: 20

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: student
      POSTGRES_PASSWORD: HjjnGytfnhg
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U student -d db']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [lab]
    volumes:
      - ./init:/docker-entrypoint-initdb.d:ro
      - chat-data:/var/lib/postgresql/data

  zap:
    image: ghcr.io/zaproxy/zaproxy:stable
    environment:
      ZAP_WEBSWING_OPTS: '-host 0.0.0.0 -port 8090'
    command: ['zap-webswing.sh']
    ports:
      - '127.0.0.1:8081:8080'
      - '127.0.0.1:8091:8090'
    networks: [lab]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - zap-data:/home/zap/.ZAP

volumes:
  chat-data:
  zap-data:

networks:
  lab:
    driver: bridge
