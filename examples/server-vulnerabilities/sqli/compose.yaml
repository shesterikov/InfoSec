services:
  app:
    build: .
    ports: ["127.0.0.1:8081:8080"]
    environment:
      DATABASE_URL: postgres://demo:demo@db/demo?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    volumes: ["./init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 2s
      retries: 30
